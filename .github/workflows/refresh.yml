name: Refresh Le Signal

# The 37-year backtest comes from Bloomberg and only moves when the terminal
# machine runs update_site.bat. The gate verdict on top of the page must not
# wait for that, so it is rebuilt here from public closes every trading night.

on:
  schedule:
    # 06:20 UTC Tue-Sat: after every US close, before the European morning.
    - cron: "20 6 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only — no install step, nothing to drift.
      - name: Rebuild the live blocks from public closes
        run: python scripts/refresh_public.py

      - name: Commit if the signal moved
        id: commit
        run: |
          if git diff --quiet -- web/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data.json unchanged — nothing to publish"
            exit 0
          fi
          asof=$(python -c "import json;print(json.load(open('web/data.json'))['signal']['asof'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          git commit -m "Le Signal: refresh live data (au ${asof})"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # Pages deploy has to be asked for explicitly.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
